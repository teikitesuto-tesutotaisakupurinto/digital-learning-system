<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f9fc"><title>パスワード再設定 | デジタル問題演習</title><link rel="stylesheet" href="/login.css"><style>.reset-card{width:min(100%,480px);margin:auto;background:#fff;border:1px solid #e6ebf3;border-radius:20px;padding:42px;box-shadow:0 20px 60px #1e345d12}.reset-card h1{font-size:26px;margin:10px 0}.reset-card p{color:#718096;font-size:13px;line-height:1.9}.reset-card label{display:block;font-size:12px;font-weight:700;margin:22px 0 8px}.reset-card input{width:100%;height:50px;border:1px solid #dce3ed;border-radius:9px;padding:0 13px;font:inherit}.reset-card button{width:100%;height:50px;margin-top:18px;border:0;border-radius:9px;background:#31599a;color:white;font-weight:700;cursor:pointer}.reset-card a{display:block;text-align:center;margin-top:22px;color:#4268aa;font-size:12px;text-decoration:none}.reset-message{margin-top:14px;font-size:12px;color:#b42318;line-height:1.7}@media(max-width:600px){.reset-card{padding:28px 22px}}</style></head><body class="login-page"><main class="reset-card"><p class="form-kicker">ACCOUNT RECOVERY</p><h1>新しいパスワードを設定</h1><p>新しいパスワードを入力してください。安全のため、他のサービスと異なるパスワードを設定してください。</p><form id="reset-form"><label for="password">新しいパスワード（8文字以上）</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirm">パスワード（確認）</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required><button id="reset-button">パスワードを更新</button><div id="reset-message" class="reset-message" role="status"></div></form><a href="/login.html">ログイン画面へ戻る</a></main><script type="module" src="/reset-password.js"></script></body></html>
