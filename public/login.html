<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>ログイン | デジタル問題演習</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;color:#172033;font-family:Arial,"Noto Sans JP",sans-serif;display:grid;place-items:center;padding:24px}
    .card{width:min(100%,420px);background:#fff;border:1px solid #e5e9f0;border-radius:14px;padding:38px;box-shadow:0 12px 36px rgba(20,35,60,.06)}
    .brand{font-size:19px;font-weight:700;letter-spacing:.02em;margin-bottom:34px;color:#2457c5}
    h1{font-size:25px;margin:0 0 8px} .sub{font-size:13px;color:#687386;margin:0 0 30px}
    label{display:block;font-size:13px;font-weight:600;margin:18px 0 8px}
    input{width:100%;height:48px;border:1px solid #ccd4e0;border-radius:8px;padding:0 13px;font-size:15px;outline:none}
    input:focus{border-color:#3267d6;box-shadow:0 0 0 3px #3267d61c}
    button{width:100%;height:48px;margin-top:25px;border:0;border-radius:8px;background:#285cc8;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}.message{min-height:22px;margin-top:14px;font-size:13px;color:#c03939;line-height:1.6}
    .help{font-size:12px;color:#7b8493;text-align:center;margin-top:26px}
    footer{font-size:11px;color:#9aa3b1;text-align:center;margin-top:26px}
    @media(max-width:480px){.card{padding:28px 22px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">デジタル問題演習</div>
    <h1>ログイン</h1>
    <p class="sub">メールアドレスとパスワードを入力してください。</p>
    <form id="login-form">
      <label for="email">メールアドレス</label>
      <input id="email" name="email" type="email" autocomplete="username" placeholder="name@example.com" required>
      <label for="password">パスワード</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="パスワード" required>
      <button id="login-button" type="submit">ログイン</button>
      <div id="login-message" class="message" role="alert"></div>
    </form>
    <p class="help">アカウントの発行・変更は先生にお問い合わせください。</p>
    <footer>© 2026 デジタル問題演習. All Rights Reserved.</footer>
  </main>
  <script type="module" src="/login.js"></script>
</body>
</html>
