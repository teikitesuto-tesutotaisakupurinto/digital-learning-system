<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン | デジタル問題演習</title><link rel="stylesheet" href="/portal.css"></head>
<body class="login-body"><header class="topbar"><strong>デジタル問題演習</strong></header><main class="login-wrap"><section class="login-card"><p class="eyebrow">DIGITAL LEARNING SYSTEM</p><h1>ログイン</h1><p class="muted">登録済みのメールアドレスとパスワードを入力してください。</p><form id="login-form"><label>メールアドレス<input id="email" type="email" autocomplete="username" required></label><label>パスワード<input id="password" type="password" autocomplete="current-password" required></label><button id="login-button" class="primary">ログイン</button><p id="login-message" class="message" aria-live="polite"></p></form><p class="muted small">アカウントの新規作成は管理者が行います。</p></section></main><footer>© 2026 デジタル問題演習. All Rights Reserved.</footer>
<script type="module">
import {Client,Account} from "https://cdn.jsdelivr.net/npm/appwrite@17.0.0/+esm";
const client=new Client().setEndpoint("https://sgp.cloud.appwrite.io/v1").setProject("6b03d796003d1c4e4943");
const account=new Account(client),form=document.getElementById("login-form"),button=document.getElementById("login-button"),message=document.getElementById("login-message");
form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;button.textContent="ログイン中…";message.textContent="";
try{await account.createEmailPasswordSession(document.getElementById("email").value.trim(),document.getElementById("password").value);
const jwt=await account.createJWT();sessionStorage.setItem("dls_jwt",jwt.jwt);
const r=await fetch("/api/me",{headers:{Authorization:"Bearer "+jwt.jwt}});const data=await r.json();if(!r.ok)throw new Error(data.error||"利用権限を確認できません。");
location.href="/"+data.user.role+"/dashboard.html";
}catch(err){message.textContent=err.message||"ログインできませんでした。";message.className="message error";button.disabled=false;button.textContent="ログイン";}});
</script></body></html>
