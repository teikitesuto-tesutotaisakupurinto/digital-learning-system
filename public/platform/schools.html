<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>学校管理 | デジタル問題演習</title>
<style>
:root{font-family:Inter,"Noto Sans JP",system-ui,sans-serif;color:#192f49;background:#f3f6fa;font-size:14px}
*{box-sizing:border-box}body{margin:0}.top{height:66px;background:#fff;border-bottom:1px solid #dfe6ee;display:flex;align-items:center;justify-content:space-between;padding:0 max(22px,calc((100vw - 1160px)/2))}
.brand{display:flex;align-items:center;gap:11px;font-weight:750}.mark{width:35px;height:35px;border-radius:9px;background:#142943;color:#fff;display:grid;place-items:center;font-size:11px}
main{max-width:1160px;margin:36px auto;padding:0 22px}.eyebrow{font-size:10px;letter-spacing:.15em;color:#7e8da0;font-weight:800}h1{font-size:27px;letter-spacing:-.03em;margin:8px 0 8px}.lead{color:#718096;margin:0 0 25px;line-height:1.8}
.panel{background:#fff;border:1px solid #dfe6ee;border-radius:12px;padding:23px;margin:16px 0;box-shadow:0 2px 10px #172b4508}.panel h2{font-size:15px;margin:0 0 17px}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px;color:#50637a;font-size:11px;font-weight:700}.field input{height:40px;border:1px solid #d6e0ea;border-radius:7px;padding:0 11px;font:inherit;color:#213b58}.wide{grid-column:1/-1}
button{height:38px;border-radius:7px;padding:0 15px;border:1px solid #cbd8e5;background:#fff;color:#345574;font:inherit;font-size:12px;font-weight:700;cursor:pointer}button.primary{background:#245f99;border-color:#245f99;color:#fff}button:disabled{opacity:.55;cursor:wait}
table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:13px 11px;border-bottom:1px solid #edf1f5}th{font-size:10px;color:#7b8a9d;background:#f7f9fc}td{color:#40536b}.status{display:inline-block;padding:4px 7px;border-radius:5px;background:#eaf7f0;color:#187653;font-size:10px;font-weight:700}.status.off{background:#fff1ef;color:#b42318}
.notice{padding:11px 13px;border-radius:7px;background:#f3f7fb;color:#4b627a;margin:12px 0;display:none}.notice.show{display:block}.muted{color:#8593a5;font-size:11px}
@media(max-width:650px){main{margin:24px auto}.form{grid-template-columns:1fr}.wide{grid-column:auto}.panel{padding:16px;overflow:auto}.top{padding:0 14px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span class="mark">DL</span><span>デジタル問題演習 <span class="muted">/ PLATFORM</span></span></div><button id="logout">ログアウト</button></header>
<main>
<div class="eyebrow">PLATFORM OPERATIONS</div><h1>学校・導入先管理</h1><p class="lead">学校ごとの利用環境を作成し、利用状態を管理します。この画面の操作はプラットフォーム管理者として許可されたアカウントのみ実行できます。</p>
<div id="notice" class="notice" role="status"></div>
<section class="panel"><h2>新しい学校を登録</h2><form id="create-form" class="form">
<label class="field">学校・塾名<input name="schoolName" maxlength="255" required></label>
<label class="field">ログインURL識別子<input name="slug" maxlength="64" pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="teiki-test" required><span class="muted">英小文字・数字・ハイフン。例：teiki-test</span></label>
<label class="field">初期管理者名<input name="name" maxlength="255" required></label>
<label class="field">初期管理者メールアドレス<input name="email" type="email" required></label>
<label class="field">初期パスワード（12文字以上）<input name="password" type="password" minlength="12" autocomplete="new-password" required></label>
<div class="wide"><button class="primary" type="submit">学校環境を作成</button></div>
</form></section>
<section class="panel"><h2>登録済みの学校</h2><div class="muted">学校単位でデータが分離されています。利用停止中の学校はログインできません。</div><div style="overflow:auto;margin-top:14px"><table><thead><tr><th>学校名</th><th>専用ログインURL</th><th>プラン</th><th>状態</th><th>操作</th></tr></thead><tbody id="school-rows"><tr><td colspan="5">読み込み中…</td></tr></tbody></table></div></section>
</main>
<script type="module">
import {Client,Account} from "https://cdn.jsdelivr.net/npm/appwrite@17.0.0/+esm";
const client=new Client().setEndpoint("https://sgp.cloud.appwrite.io/v1").setProject("6b03d796003d1c4e4943");
const account=new Account(client),$=s=>document.querySelector(s);
const esc=s=>String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
let jwt="";
async function api(url,options={}){if(!jwt)jwt=(await account.createJWT()).jwt;const headers={Authorization:"Bearer "+jwt,...(options.headers||{})};if(options.body)headers["Content-Type"]="application/json";const r=await fetch(url,{...options,headers});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||"処理に失敗しました。");return data}
function notice(message){$("#notice").textContent=message;$("#notice").classList.add("show")}
async function load(){const d=await api("/api/platform/schools");$("#school-rows").innerHTML=d.schools.map(s=>'<tr><td><strong>'+esc(s.name)+'</strong></td><td><a href="/'+encodeURIComponent(s.slug)+'/login" target="_blank" rel="noopener">/'+esc(s.slug)+'/login</a></td><td>'+esc(s.plan)+'</td><td><span class="status '+(s.status==="active"?"":"off")+'">'+(s.status==="active"?"利用中":"利用停止")+'</span></td><td><button type="button" data-id="'+esc(s.id)+'" data-next="'+(s.status==="active"?"suspended":"active")+'">'+(s.status==="active"?"利用停止":"利用再開")+'</button></td></tr>').join("")||'<tr><td colspan="5">学校はまだ登録されていません。</td></tr>';document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{b.disabled=true;try{await api("/api/platform/schools/"+encodeURIComponent(b.dataset.id)+"/status",{method:"PATCH",body:JSON.stringify({status:b.dataset.next})});await load()}catch(e){notice(e.message);b.disabled=false}})}
try{const me=await api("/api/me");if(!me.user.platformAdmin)throw new Error("このアカウントにはプラットフォーム管理権限がありません。");await load()}catch(e){notice(e.message);$("#create-form").querySelectorAll("input,button").forEach(x=>x.disabled=true)}
$("#create-form").onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector("button");b.disabled=true;try{const body=Object.fromEntries(new FormData(e.currentTarget));const d=await api("/api/platform/schools",{method:"POST",body:JSON.stringify(body)});notice(d.school.name+" の学校環境を作成しました。ログインURL："+location.origin+d.school.loginUrl);e.currentTarget.reset();await load()}catch(err){notice(err.message)}finally{b.disabled=false}};
$("#logout").onclick=async()=>{try{await account.deleteSession("current")}catch{}location.replace("/login.html")};
</script>
</body></html>
